site_name: Axis Documentation
site_description: Documentation for the GDG HAU ecosystem

theme:
  name: readthedocs

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Project Overview:
      - Mission and Context: project-overview/mission.md
      - Repository Layout: project-overview/repository-layout.md
      - File and Directory Guide: project-overview/file-and-directory-guide.md
      - Getting Started: project-overview/getting-started.md
  - Product:
      - Platform: product/platform.md
      - Roles: product/roles.md
      - User Flows: product/flows.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Apps: architecture/apps.md
      - Shared Packages: architecture/packages.md
      - Auth and RBAC: architecture/auth-rbac.md
  - API:
      - API Overview: api/overview.md
      - Routes: api/routes.md
      - Functions: api/functions.md
  - Data:
      - Schema Overview: schema/overview.md
      - Migrations: schema/migrations.md
      - Tables: schema/tables.md
  - Runbooks:
      - Local Development: runbooks/local-dev.md
      - Deployment: runbooks/deployment.md
      - Environment Configuration: runbooks/environment-configuration.md
      - Final Acceptance Audit: runbooks/final-acceptance.md
      - Security Deployment: runbooks/security-deployment.md
      - Member Portal Operations: runbooks/member-portal-operations.md
      - Notifications and Communications: runbooks/notifications-communications.md
      - Article Content Publishing: runbooks/article-content-publishing.md
      - Reporting and Analytics: runbooks/reporting-analytics.md
      - Rewards and Redemptions: runbooks/rewards-redemptions.md
      - System Readiness: runbooks/system-readiness.md
      - Troubleshooting: runbooks/troubleshooting.md
  - Integrations:
      - Bevy Events: integrations/bevy-events.md
      - Luma Attendance: integrations/luma-attendance.md
  - Contributing:
      - Standards: contributing/standards.md
      - UI/UX Guide: contributing/ui-ux.md
      - Application Shells: contributing/application-shells.md
      - Documentation Rules: contributing/docs-rules.md

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
